[package]
name = "sony-center"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sony-protocol = { path = "../sony-protocol" }
sony-transport = { path = "../sony-transport" }
sony-app = { path = "../sony-app" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
